name: Crawl investor website
run-name: Crawl item ${{ inputs.item_id }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL to crawl
        required: true
        type: string
      item_id:
        description: monday item ID
        required: true
        type: string
      board_id:
        description: monday board ID
        required: true
        type: string

# The monday server needs Actions: write to dispatch this workflow. The crawler
# itself needs no repository permissions.
permissions:
  contents: read

concurrency:
  group: investor-crawl-${{ inputs.item_id }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRAWL_URL: ${{ inputs.url }}
      ITEM_ID: ${{ inputs.item_id }}
      BOARD_ID: ${{ inputs.board_id }}
      # Use the Google Chrome preinstalled on the runner: no browser download or
      # apt-get step, which is what made runs slow or hang.
      BROWSER_CHANNEL: chrome
      PYTHONUTF8: "1"
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    steps:
      - name: Check out crawler
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install crawler dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt

      - name: Crawl and report
        timeout-minutes: 22
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: python crawl.py

      - name: Report workflow failure
        if: failure() || cancelled()
        timeout-minutes: 2
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: python3 report_failure.py
